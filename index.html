<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cats of Sands</title>
  </head>
  <body>
    <main>
      <h1>Cats of Sands</h1>
      <form id="launch">
        <label for="map">Карта</label>
        <select id="map" name="map" required disabled></select>
        <fieldset>
          <legend>Аддоны</legend>
          <div id="addons"></div>
        </fieldset>
        <button type="submit" disabled>Запустить</button>
      </form>
      <p id="error" role="alert" hidden></p>
      <canvas width="640" height="360" aria-label="Демонстрационная сцена" hidden></canvas>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
